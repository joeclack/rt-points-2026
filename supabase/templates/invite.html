<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accept your admin invitation</title>
  </head>
  <body style="margin: 0; background-color: #f1f5f9; color: #0f172a; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f1f5f9;">
      <tr>
        <td align="center" style="padding: 40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 560px; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px;">
            <tr>
              <td style="padding: 32px;">
                <p style="margin: 0 0 20px; color: #475569; font-size: 14px; font-weight: 700; line-height: 20px;">
                  TJG Tournaments
                </p>
                <h2 style="margin: 0 0 16px; color: #0f172a; font-size: 24px; line-height: 32px;">
                  You have been invited
                </h2>
                <p style="margin: 0 0 24px; color: #475569; font-size: 16px; line-height: 24px;">
                  Follow the secure link below to choose a password and create your tournament admin account.
                </p>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td style="border-radius: 6px; background-color: #0f172a;">
                      <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=invite" style="display: inline-block; padding: 12px 18px; color: #ffffff; font-size: 15px; font-weight: 700; line-height: 20px; text-decoration: none;">
                        Accept invitation
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin: 24px 0 0; color: #64748b; font-size: 13px; line-height: 20px;">
                  If you were not expecting this invitation, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
