<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | TJG Tournaments</title>
    <style>
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }
      main {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        max-width: 420px;
        padding: 32px;
        text-align: center;
        width: 100%;
      }
      img { border-radius: 22%; height: 72px; width: 72px; }
      h1 { font-size: 24px; margin: 20px 0 8px; }
      p { color: #475569; line-height: 1.5; margin: 0; }
      button {
        background: #0f172a;
        border: 0;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        margin-top: 24px;
        padding: 12px 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <img alt="" src="/icons/icon-192.png" />
      <h1>You’re offline</h1>
      <p>Reconnect to load the latest tournament scores and controls.</p>
      <button onclick="window.location.reload()" type="button">Try again</button>
    </main>
  </body>
</html>
